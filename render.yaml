# Render blueprint. Push this repo to GitHub, then in Render:
#   New + → Blueprint → pick this repo. Render reads this file and provisions
#   the backend web service on the free tier.
#
# The SQLite DB lives inside the container (no persistent disk), so it resets
# on each redeploy — fine for a demo. seed-if-empty.js re-seeds a fresh DB on
# every deploy build. Free services also sleep after 15 min idle (~30s cold start).
#
# After the frontend is on Netlify, set CORS_ORIGIN (below) to the Netlify URL
# and redeploy so the browser is allowed to call the API.
services:
  - type: web
    name: pioneer-health-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:./prod.db
      - key: CORS_ORIGIN
        value: "https://sensational-hamster-415d19.netlify.app"
