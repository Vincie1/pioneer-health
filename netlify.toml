# Netlify hosts the React frontend. Set VITE_API_URL (in the Netlify UI or here)
# to your deployed backend, e.g. https://pioneer-health-api.onrender.com
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

# SPA fallback so React Router deep links (e.g. /dashboard) resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
